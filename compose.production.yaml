name: enterprise-rag-prod-105c1-20261105

services:
  api:
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile
    image: enterprise-rag-api:production
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    environment:
      RAG_ENV: production
      RAG_LOG_LEVEL: ${RAG_LOG_LEVEL:-INFO}
      RAG_TRUSTED_ORIGINS: ${RAG_TRUSTED_ORIGINS:?Set the HTTPS public origin}
      RAG_API_COLLECTION: ${RAG_API_COLLECTION:-rag_chunks}
      RAG_API_QDRANT_TIMEOUT: ${RAG_API_QDRANT_TIMEOUT:-10}
      RAG_DOCUMENT_DIR: /var/lib/rag-agent/documents
      QDRANT_URL: https://qdrant:6333
      QDRANT_API_KEY_FILE: /run/secrets/qdrant_api_key
      QDRANT_CA_CERT_FILE: /run/secrets/qdrant_ca_cert
      RAG_LLM_PROVIDER: ollama
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:?Set an already provisioned Ollama model tag}
      RAG_LLM_BASE_URL: http://ollama:11434
      RAG_LLM_TIMEOUT_SECONDS: ${RAG_LLM_TIMEOUT_SECONDS:-60}
      RAG_LLM_MAX_OUTPUT_TOKENS: ${RAG_LLM_MAX_OUTPUT_TOKENS:-2048}
      RAG_LLM_MAX_RESPONSE_BYTES: ${RAG_LLM_MAX_RESPONSE_BYTES:-131072}
      RAG_MAX_EVIDENCE_CHARS: ${RAG_MAX_EVIDENCE_CHARS:-24000}
      RAG_MAX_EVIDENCE_CHUNKS: ${RAG_MAX_EVIDENCE_CHUNKS:-12}
      RAG_UPLOAD_MAX_BYTES: ${RAG_UPLOAD_MAX_BYTES:-20971520}
      RAG_DOCUMENT_MAX_PAGES: ${RAG_DOCUMENT_MAX_PAGES:-500}
      RAG_DOCUMENT_MAX_CHUNKS: ${RAG_DOCUMENT_MAX_CHUNKS:-10000}
      RAG_LOGIN_RATE_LIMIT_ATTEMPTS: ${RAG_LOGIN_RATE_LIMIT_ATTEMPTS:-10}
      RAG_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${RAG_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
      RAG_UPLOAD_RATE_LIMIT_ATTEMPTS: ${RAG_UPLOAD_RATE_LIMIT_ATTEMPTS:-10}
      RAG_UPLOAD_RATE_LIMIT_WINDOW_SECONDS: ${RAG_UPLOAD_RATE_LIMIT_WINDOW_SECONDS:-3600}
      RERANKER_CANDIDATE_COUNT: ${RERANKER_CANDIDATE_COUNT:-20}
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      HF_HOME: /var/cache/huggingface
      HF_HUB_CACHE: /var/cache/huggingface/hub
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    secrets:
      - source: api_qdrant_api_key
        target: qdrant_api_key
      - source: qdrant_ca_cert
        target: qdrant_ca_cert
    volumes:
      - documents:/var/lib/rag-agent/documents
      - hf_cache:/var/cache/huggingface
    networks:
      app_internal:
        ipv4_address: 172.30.105.3
      data_internal: {}
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=15)"
      interval: 30s
      timeout: 20s
      start_period: 45s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    entrypoint:
      - /bin/sh
      - /qdrant/entrypoint-secret.sh
    environment:
      QDRANT__SERVICE__ENABLE_TLS: "true"
      QDRANT__TLS__CERT: /run/secrets/qdrant_server_cert
      QDRANT__TLS__KEY: /run/secrets/qdrant_server_key
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/snapshots
      QDRANT_INIT_FILE_PATH: /qdrant/storage/.qdrant-initialized
    secrets:
      - source: qdrant_server_api_key
        target: qdrant_api_key
      - source: qdrant_server_cert
        target: qdrant_server_cert
      - source: qdrant_server_key
        target: qdrant_server_key
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
      - ./scripts/qdrant-entrypoint.sh:/qdrant/entrypoint-secret.sh:ro
    networks:
      - data_internal
  ollama:
    image: ollama/ollama:0.40.14
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - data_internal
    # No host port and no model pull: provision an approved model separately.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: enterprise-rag-frontend:production
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    environment:
      RAG_PUBLIC_DOMAIN: ${RAG_PUBLIC_DOMAIN:?Set the public DNS name}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge: {}
      app_internal:
        ipv4_address: 172.30.105.2
    depends_on:
      api:
        condition: service_healthy

secrets:
  # File-backed secret ownership/mode comes from these host files.
  api_qdrant_api_key:
    file: ${QDRANT_API_KEY_FILE:?Set a path to the API-only Qdrant API-key secret file}
  qdrant_server_api_key:
    file: ${QDRANT_SERVER_API_KEY_FILE:?Set a path to the Qdrant API-key secret file}
  qdrant_ca_cert:
    file: ${QDRANT_CA_CERT_FILE:?Set a path to the Qdrant CA certificate}
  qdrant_server_cert:
    file: ${QDRANT_SERVER_TLS_CERT_FILE:?Set a path to the Qdrant server certificate}
  qdrant_server_key:
    file: ${QDRANT_SERVER_TLS_KEY_FILE:?Set a path to the Qdrant server private key}

volumes:
  documents:
  hf_cache:
  qdrant_storage:
  qdrant_snapshots:
  ollama_models:
  caddy_data:
  caddy_config:

networks:
  edge:
  app_internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.105.0/29
  data_internal:
    internal: true
